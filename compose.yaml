name: circulos-einstein

services:
  circulos:
    image: circulos-einstein:local
    build:
      context: .
      target: runtime
    init: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATA_DIR: /app/data
    # Local access only. This does not expose student records to the Internet.
    ports:
      - "127.0.0.1:${CIRCULOS_PORT:-3001}:3001"
    volumes:
      - circulos-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  circulos-data:
